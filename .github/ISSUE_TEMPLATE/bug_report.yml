name: Bug report
description: Report a problem with vminv
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please **do not include passwords or secrets**.
        For security vulnerabilities, use a private advisory instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: vminv version
      description: Output of `vminv version`
      placeholder: "0.1.0"
    validations: { required: true }
  - type: dropdown
    id: path
    attributes:
      label: Implementation
      options: [bash + govc, PowerCLI, both/unsure]
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS/arch, bash/pwsh version, vCenter/ESXi version
      placeholder: "Ubuntu 22.04 x86_64, bash 5.2, vCenter 8.0.2"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, what occurred. Paste relevant `run.log` (redacted) or `vminv --dry-run -v` output.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. vminv configure ...
        2. vminv --dry-run
        3. ...

name: Feature request
description: Suggest an enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what's missing today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This keeps vminv strictly read-only (no vCenter mutations)
        - label: If it adds/changes output, it applies to BOTH the bash and PowerCLI paths

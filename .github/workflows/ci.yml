name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (syntax + shellcheck + PS parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: bash syntax (-n)
        run: for f in vminv setup.sh lib/*.sh tests/*.sh; do bash -n "$f"; done
      - name: shellcheck (errors only)
        run: shellcheck --severity=error -e SC1090,SC1091 vminv setup.sh lib/*.sh tests/*.sh
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse powershell -Include *.ps1,*.psm1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count) { $bad++; Write-Host "PARSE FAIL: $($_.FullName)"; $errs | ForEach-Object { Write-Host "  $($_.Message)" } }
          }
          if ($bad) { exit 1 } else { Write-Host 'PowerShell parse OK' }

  test-linux:
    name: tests + bash⇄PowerShell conformance (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }  
      - name: Install pinned tools (govc + jq, checksum-verified)
        run: ./setup.sh --no-cli --user
      - name: Readiness (doctor)
        run: ./vminv doctor || true
      - name: Full offline test suite (incl. conformance)
        run: ./tests/run_tests.sh
        env:
          PWSH: pwsh
      - name: Demo smoke test
        run: |
          ./vminv demo --output /tmp/ci-demo --quiet
          test -s "$(ls -d /tmp/ci-demo/*/ | head -1)/summary.md"

  test-macos:
    name: tests (macOS, bash 4+ portability)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Install bash 4+ (macOS ships 3.2)
        run: brew install bash
      - name: Run suite under modern bash + Darwin tool assets
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"   # prefer brew bash 5.x
          bash --version | head -1
          ./setup.sh --no-cli --user
          ./tests/run_tests.sh
        env:
          PWSH: pwsh   # macOS runners ship pwsh; conformance runs (else skips)

  test-windows-powershell:
    name: PowerCLI path (Windows, native pwsh)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: PowerShell module fixture check
        shell: pwsh
        run: ./powershell/tests/Invoke-CiCheck.ps1

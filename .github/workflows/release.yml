name: Release

# Tag a release:  git tag v1.2.3 && git push origin v1.2.3
# The tag MUST match the VERSION file (enforced below). The published
# checksums.txt is what `vminv upgrade` verifies the downloaded source against.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: write   # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: test gate (must pass before release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: ./setup.sh --no-cli --user
      - run: ./tests/run_tests.sh
        env:
          PWSH: pwsh

  release:
    name: build + publish release
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Tag must match the VERSION file
        run: |
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          FILE="$(cat VERSION)"
          if [ "$FILE" != "$VER" ]; then
            echo "::error::VERSION file ('$FILE') != tag ('$VER'). Bump VERSION and re-tag." >&2
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build checksums + release artifact
        run: |
          # Checksum of the GitHub source archive — what `vminv upgrade` downloads.
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL --retry 5 --retry-delay 3 -o "/tmp/${TAG}.tar.gz" "$url"
          ARCHIVE_SHA="$(sha256sum "/tmp/${TAG}.tar.gz" | awk '{print $1}')"
          # Clean, prefixed distributable artifact (tracked files only).
          git archive --format=tar.gz --prefix="vminv-${VER}/" -o "vminv-${VER}.tar.gz" "$TAG"
          ARTIFACT_SHA="$(sha256sum "vminv-${VER}.tar.gz" | awk '{print $1}')"
          # First line = source archive (vminv upgrade reads the first .tar.gz line).
          {
            echo "${ARCHIVE_SHA}  ${TAG}.tar.gz"
            echo "${ARTIFACT_SHA}  vminv-${VER}.tar.gz"
          } > checksums.txt
          echo "checksums.txt:"; cat checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            checksums.txt "vminv-${VER}.tar.gz" \
            --title "vminv ${TAG}" \
            --generate-notes \
            --verify-tag
